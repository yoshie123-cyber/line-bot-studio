# Render Blueprint: AI電話受付サーバー（ai-phone/）
# 無料プランはスリープして最初の着信に間に合わないため、有料の Starter を指定しています。
services:
  - type: web
    name: ai-phone
    runtime: node
    rootDir: ai-phone
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRANSFER_PHONE_NUMBER
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: BUSINESS_INFO
        sync: false
